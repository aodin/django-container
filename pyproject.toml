[project]
name = "django-container"
version = "0.1.0"
description = "Django app containerized and deployed to AWS ECS Fargate"
requires-python = "==3.14.*"
dependencies = [
    "django>=6.0.7,<6.1",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
# extend-exclude, not exclude: keeps ruff's built-in excludes (.venv, .git, ...).
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
